name: Deploy to AWS

on:
  push:
    branches:
      - develop
      - qa
      - uat
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - uat
          - prod

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod') || (github.ref_name == 'uat' && 'uat') || (github.ref_name == 'qa' && 'qa') || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod') || (github.ref_name == 'uat' && 'uat') || (github.ref_name == 'qa' && 'qa') || 'dev' }}
        run: |
          docker build -t $ECR_REGISTRY/dev-expenses-$ENVIRONMENT:$IMAGE_TAG .
          docker push $ECR_REGISTRY/dev-expenses-$ENVIRONMENT:$IMAGE_TAG

      - name: Update ECS service with new image
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod') || (github.ref_name == 'uat' && 'uat') || (github.ref_name == 'qa' && 'qa') || 'dev' }}
        run: |
          aws ecs update-service \
            --cluster dev-expenses-$ENVIRONMENT \
            --service dev-expenses-$ENVIRONMENT-blue \
            --force-new-deployment \
            --region us-east-1
